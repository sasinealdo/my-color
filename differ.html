
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RWF Currency Converter</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #eaf2f8;
            margin: 0;
        }

        header {
            background: #075985;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 350px;
            max-width: 85%;
            margin: 50px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            color: #075985;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            background: #075985;
            color: white;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0369a1;
        }

        .result {
            background: #dbeafe;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
            border-radius: 8px;
        }

        footer {
            background: #075985;
            color: white;
            text-align: center;
            padding: 15px;
        }

    </style>

</head>

<body>

    <header>

        <h1>RWF Currency Converter</h1>

        <p>Convert Rwandan Francs into other currencies</p>

    </header>

    <div class="container">

        <h2>Currency Converter</h2>

        <label for="amount">
            Amount in RWF
        </label>

        <input type="number"
               id="amount"
               placeholder="Enter RWF amount"
               min="0"
               step="any">

        <label for="currency">
            Convert To
        </label>

        <select id="currency">

            <option value="USD">US Dollar (USD)</option>

            <option value="EUR">Euro (EUR)</option>

            <option value="GBP">British Pound (GBP)</option>

            <option value="KES">Kenyan Shilling (KES)</option>

            <option value="UGX">Ugandan Shilling (UGX)</option>

            <option value="TZS">Tanzanian Shilling (TZS)</option>

        </select>

        <button onclick="convertCurrency()">

            Convert Currency

        </button>

        <div class="result">

            <h3>Conversion Result</h3>

            <p id="result">
                Enter an amount to convert.
            </p>

        </div>

    </div>

    <footer>

        <p>RWF Currency Converter</p>

        <p>Developed by @aldo</p>

    </footer>

    <script>

        function convertCurrency() {

            // Get amount entered by user

            let amount = document.getElementById("amount").value;

            // Get selected currency

            let currency = document.getElementById("currency").value;

            // Example exchange rates
            // These are illustrative, not live rates.

            let rates = {

                USD: 0.0007,

                EUR: 0.0006,

                GBP: 0.0005,

                KES: 0.09,

                UGX: 2.7,

                TZS: 1.8

            };

            // Check amount

            if (amount === "" || Number(amount) <= 0) {

                document.getElementById("result").innerHTML =
                    "Please enter a valid amount.";

                return;

            }

            // Calculate conversion

            let convertedAmount =
                Number(amount) * rates[currency];

            // Display result

            document.getElementById("result").innerHTML =

                Number(amount).toLocaleString() +
                " RWF = " +

                convertedAmount.toLocaleString(
                    undefined,
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                ) +

                " " + currency;

        }

    </script>

</body>

</html>
